external_components:
  - source: github://vaninanton/esphome-euc-leaperkim-nosfet@main
    components: [veteran]
  - source: github://vaninanton/esphome-euc-hw-smart-charger@main
    components: [charger]
esphome:
  name: esphome-euc
  friendly_name: ESPHome EUC Sensor
  area: "Прихожая"
  devices:
    - id: lynx_device
      name: "Veteran Lynx"
    - id: nosfet_device
      name: "Nosfet Aero"
    - id: xeno_device
      name: "Nosfet Xeno"
    - id: charger_device
      name: "Fast charger"
packages:
  - !include
    file: package-veteran-device.yaml
    vars:
      euc_id: lynx
      euc_name: "Veteran Lynx"
      euc_mac: !secret euc_veteran_mac
      euc_device_id: lynx_device
      euc_nominal_voltage: 151.2
      euc_cell_count: 36
      euc_charge_voltage_min: 147.0
      euc_charge_voltage_offset: 145
      euc_disabled_entities: []
  - !include
    file: package-veteran-device.yaml
    vars:
      euc_id: nosfet
      euc_name: "Nosfet Aero"
      euc_mac: !secret euc_nosfet_mac
      euc_device_id: nosfet_device
      euc_nominal_voltage: 126
      euc_cell_count: 30
      euc_charge_voltage_min: 122.0
      euc_charge_voltage_offset: 121
      euc_disabled_entities: [low_power_mode, high_speed_mode]
  - !include
    file: package-veteran-device.yaml
    vars:
      euc_id: xeno
      euc_name: "Nosfet Xeno"
      euc_mac: !secret euc_xeno_mac
      euc_device_id: xeno_device
      euc_nominal_voltage: 126
      euc_cell_count: 30
      euc_charge_voltage_min: 122.0
      euc_charge_voltage_offset: 121
      euc_disabled_entities: [low_power_mode, high_speed_mode]
  - !include
    file: package-charger-device.yaml
    vars:
      charger_id: fast_charger
      charger_mac: !secret fast_charger_mac
      charger_device_id: charger_device
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
logger:
  level: INFO
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
api:
  encryption:
    key: !secret ha_encryption_key
  batch_delay: 150ms
  max_send_queue: 4
ota:
  - platform: esphome
    password: !secret wifi_password
web_server:
  port: 80
  include_internal: false
  version: 3
  sorting_groups:
    - id: sorting_group_configuration
      name: "Configuration"
      sorting_weight: 0
    - id: sorting_group_fast_charger
      name: "Fast charger"
      sorting_weight: 10
    - id: sorting_group_lynx
      name: "Veteran Lynx"
      sorting_weight: 20
    - id: sorting_group_nosfet
      name: "Nosfet Aero"
      sorting_weight: 30
    - id: sorting_group_xeno
      name: "Nosfet Xeno"
      sorting_weight: 40
output:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: gpio_d2
light:
  - platform: binary
    name: EUC Connected LED
    id: status
    output: gpio_d2
    internal: true
    entity_category: "diagnostic"
# 4 BLE-клиента (Lynx + Aero + Xeno + charger) — дефолтных 3 слотов не хватает
esp32_ble:
  max_connections: 4
esp32_ble_tracker:
switch:
  - platform: template
    name: "Bluetooth"
    id: ble_all
    icon: mdi:bluetooth
    entity_category: config
    web_server:
      sorting_group_id: sorting_group_configuration
      sorting_weight: 0
    lambda: "return id(connected_lynx).state || id(connected_nosfet).state || id(connected_xeno).state || id(charger_connected_fast_charger).state;"
    turn_off_action:
      - switch.turn_off: ble_connect_lynx
      - switch.turn_off: ble_connect_nosfet
      - switch.turn_off: ble_connect_xeno
      - switch.turn_off: ble_connect_fast_charger
    turn_on_action:
      - switch.turn_on: ble_connect_lynx
      - switch.turn_on: ble_connect_nosfet
      - switch.turn_on: ble_connect_xeno
      - switch.turn_on: ble_connect_fast_charger
button:
  - platform: restart
    name: "Restart ESP32"
    entity_category: diagnostic
    web_server:
      sorting_group_id: sorting_group_configuration
      sorting_weight: 1
binary_sensor:
  - platform: template
    id: any_ble_connected
    internal: true
    lambda: "return id(connected_lynx).state || id(connected_nosfet).state || id(connected_xeno).state || id(charger_connected_fast_charger).state;"
    on_state:
      - if:
          condition:
            binary_sensor.is_on: any_ble_connected
          then:
            - light.turn_on: status
          else:
            - light.turn_off: status
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
    name: "Boot Button"
    internal: true
    entity_category: diagnostic
    on_press:
      - switch.toggle: ble_all
